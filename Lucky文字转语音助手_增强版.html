<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky文字转语音助手</title>
  <style>
    :root {
      --bg-from: #f7f0e6;
      --bg-to: #eee0cd;
      --card-bg: rgba(255,252,248,0.94);
      --text: #2d241e;
      --text-secondary: #6b5d52;
      --primary: #a05a2c;
      --primary-dark: #7a411e;
      --accent: #d49a5a;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 12px 32px -6px rgba(61,43,31,0.16);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
      min-height: 100vh;
      transition: background 0.5s ease;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #2b1a10 0%, #3e2723 55%, #5d4037 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: #fff;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.85);
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      background: #fff;
    }
    .brand-text h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #f0d9b5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-text p {
      margin: 6px 0 0;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
    .theme-switch {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: transform 0.2s;
    }
    .theme-btn:hover { transform: scale(1.15); }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.6);
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(61,43,31,0.06);
      padding: 4px;
      border-radius: 12px;
    }
    .tab {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 12px rgba(79,70,229,0.35);
    }
    textarea, input[type="text"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
      resize: vertical;
      transition: border 0.2s, box-shadow 0.2s;
    }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(160,90,44,0.12);
    }
    textarea { min-height: 160px; }
    .hint {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }
    .slider-val {
      min-width: 48px;
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px 22px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 6px 18px rgba(160,90,44,0.35);
    }
    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid rgba(160,90,44,0.3);
    }
    .btn-success {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
      box-shadow: 0 6px 18px rgba(16,185,129,0.3);
    }
    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .status.info { background: #fdf0e3; color: var(--primary-dark); display: block; }
    .status.success { background: #d1fae5; color: #065f46; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; display: block; }
    .role-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .role-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px;
      padding: 14px;
    }
    .role-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .role-name .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #fbe4cf;
      color: var(--primary-dark);
    }
    .segment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .segment {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px;
      padding: 14px;
    }
    .segment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .segment-speaker {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .segment-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 10px;
    }
    .segment-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .segment-actions .btn {
      padding: 9px 15px;
      font-size: 14px;
    }
    .player-card {
      background: linear-gradient(135deg, #4e342e, #2b1a10);
      color: #fff;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .player-title {
      font-size: 15px;
      font-weight: 600;
      color: #d9c2b0;
      margin-bottom: 10px;
    }
    audio {
      width: 100%;
      border-radius: 8px;
    }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .empty svg {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .log {
      margin-top: 16px;
      padding: 12px;
      background: rgba(61,43,31,0.05);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>

</head>

      if (/小|孩|儿|宝宝|女儿|儿子|少年|幼|child|kid|boy|girl|little|small|young|son|daughter/.test(s)) age = 'child';
      else if (/teen|青少年/.test(s)) age = 'teen';
      else if (/奶奶|外婆|姥姥|爷爷|外公|老|old|elder|grand/.test(s)) age = 'senior';

      if (/妈妈|奶奶|外婆|姥姥|女|girl|woman|she|princess|queen|女儿|妻|姐|妹|阿姨|姑娘|lady|miss|sister|aunt/.test(s)) gender = 'female';

      if (/小红帽/.test(s)) { gender = 'female'; age = 'child'; }

    function detectEmotion(text) {
      const t = text.toLowerCase();
      const scores = {};
      const excl = (t.match(/!/g) || []).length;
      if (excl) scores.excited = excl;
      const rules = [
        ['fear', ['怕', '害怕', '吓', '危险', '救命', '惊恐', '慌', 'afraid', 'scared', 'frightened', 'fear', 'worried', 'danger']],
        ['angry', ['凶', '吼', '怒', '咆哮', 'angry', 'shout', 'yell', 'furious', 'roar', 'growl']],
        ['excited', ['太棒', '好呀', '哈哈', '开心', '喜欢', '棒', 'yay', 'hurray', 'great', 'amazing', 'love', 'excited', 'hooray']],
        ['happy', ['高兴', '笑', '甜', 'happy', 'glad', 'joy', 'laugh', 'cheer', 'sweet']],
        ['sad', ['伤心', '哭', '可怜', '泪', '难受', 'sad', 'cry', 'poor', 'sorry', 'tears']],
        ['serious', ['记住', '一定', '千万', '不要', '小心', 'serious', 'remember', 'must', 'never', 'warning']],
        ['gentle', ['温柔', '柔', '悄悄', 'gentle', 'softly', 'quietly', 'whisper', 'soft']]
      ];
      for (const [emo, kws] of rules) {
        let c = 0;
        for (const kw of kws) if (t.includes(kw)) c++;
        if (c) scores[emo] = (scores[emo] || 0) + c;
      }
      if (!Object.keys(scores).length) return 'neutral';
      return Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    }

    function agePitch(age) {
      if (age === 'child') return 12;
      if (age === 'teen') return 6;
      if (age === 'adult') return 0;
      return -6;
    }

      const [r0, p0, v0] = EMOTION_PROSODY[emotion] || EMOTION_PROSODY.neutral;
      const rp = Math.max(-50, Math.min(50, parseInt(r0) + ratePct));
      const pp = Math.max(-20, Math.min(20, parseInt(p0) + pitchHz));
      const vp = Math.max(-50, Math.min(50, parseInt(v0) + volumePct));
      return { rate: `${rp>=0?'+':''}${rp}%`, pitch: `${pp>=0?'+':''}${pp}Hz`, volume: `${vp>=0?'+':''}${vp}%` };
    }

        const voices = speechSynthesis.getVoices();
        if (!voices.length) return null;
        let v = voices.find(v => v.lang === lang);
        if (v) return v;
        const prefix = lang.split('-')[0];
        v = voices.find(v => v.lang.startsWith(prefix));

      }

        });

          utter.pitch = Math.max(0, Math.min(2, 1 + this._hz(this.pitch) / 50));

          }, 60000);

            clearTimeout(timeout);
            resolve(new Blob([new Uint8Array([0])], { type: 'audio/local-marker' }));
          };
          utter.onerror = (e) => {
            clearTimeout(timeout);
            resolve(new Blob([new Uint8Array([0])], { type: 'audio/local-marker' }));
          };

          speechSynthesis.speak(utter);
        });

      static speakNow(text, voice, pitch, rate, volume) {
        if (!LocalTTS.isAvailable()) return false;
        const ltts = new LocalTTS();
        ltts.voice = voice || 'zh-CN-XiaoxiaoNeural';
        ltts.pitch = pitch || '+0Hz';
        ltts.rate = rate || '+0%';
        ltts.volume = volume || '+0%';
        const lang = ltts._voiceLang(ltts.voice);
        const v = ltts._findVoice(lang, ltts.voice);
        const utter = new SpeechSynthesisUtterance(text);
        if (v) { utter.voice = v; utter.lang = v.lang; } else { utter.lang = lang; }
        utter.rate = Math.max(0.1, Math.min(10, 1 + ltts._pct(ltts.rate) / 100));
        utter.pitch = Math.max(0, Math.min(2, 1 + ltts._hz(ltts.pitch) / 50));
        utter.volume = Math.max(0, Math.min(1, 1 + ltts._pct(ltts.volume) / 100));
        speechSynthesis.cancel();
        speechSynthesis.speak(utter);
        return true;
      }
    }

        return ROLE_ALIAS[key] || key;
      }
      parseRoles() {
        const text = this.getText();
        if (!text) return this.log('请先输入文本。', 'error');
        const segs = this.parseSegments(text);
        this.segments = segs;
        // 按出现顺序收集角色，并保留括号里的性别提示（女声/男声）
        const order = [];
        const genderHint = {};
        for (const s of segs) {
          if (s.speaker === '旁白') continue;
          if (!order.includes(s.speaker)) {
            order.push(s.speaker);
            genderHint[s.speaker] = this.genderFromAnnotation(s.raw);
          }
        }
        const hasNarrator = segs.some(s => s.speaker === '旁白');
        const allNames = order.slice();
        if (hasNarrator && !allNames.includes('旁白')) allNames.push('旁白');
        if (!allNames.length) allNames.push('旁白');
        this.roles = {};
        const lang = detectLang(text);
        for (const name of allNames) {
          const roleKey = this.normalizeRole(name);
          let gender = 'neutral', age = 'adult';
          if (name === '旁白' || name.toLowerCase() === 'narrator') { gender = 'male'; age = 'adult'; }
          else {
            const inf = inferGenderAge(name);
            gender = inf.gender; age = inf.age;
            const gh = genderHint[name];
            if (gh) gender = gh; // 括号里的“女声/男声”优先
          }
          this.roles[name] = { name, roleKey, gender, age, emotion: 'story', rate: 0, volume: 0, pitch: agePitch(age), voice: resolveVoice(gender, age, lang) };
        }
        this.renderRoles();
        this.log(`已解析 ${allNames.length} 个角色。`, 'success');
      }
      genderFromAnnotation(raw) {
        if (!raw) return null;
        const s = raw.toLowerCase();
        if (/女|female|woman|girl|lady|princess|queen|daughter|sister|aunt|mother|妻|姐|妹|阿姨|姑娘|小姐/.test(s)) return 'female';
        if (/男|male|man|boy|king|prince|son|brother|uncle|father|叔|哥|弟|先生/.test(s)) return 'male';
        return null;
      }
      renderRoles() {
        const box = document.getElementById('roleList');
        box.innerHTML = '';
        for (const r of Object.values(this.roles)) {
          const div = document.createElement('div');
          div.className = 'role-card';
          div.innerHTML = `
            <div class="role-name">${r.name} <span class="badge">${r.roleKey}</span></div>
            <div class="form-grid" style="grid-template-columns:1fr 1fr">
              <div class="field"><label>性别</label><select data-name="${r.name}" data-field="gender"><option value="female" ${r.gender==='female'?'selected':''}>女</option><option value="male" ${r.gender==='male'?'selected':''}>男</option><option value="neutral" ${r.gender==='neutral'?'selected':''}>中性</option></select></div>
              <div class="field"><label>年龄段</label><select data-name="${r.name}" data-field="age"><option value="child" ${r.age==='child'?'selected':''}>儿童</option><option value="teen" ${r.age==='teen'?'selected':''}>青少年</option><option value="adult" ${r.age==='adult'?'selected':''}>成年</option><option value="senior" ${r.age==='senior'?'selected':''}>老年</option></select></div>
              <div class="field"><label>情感</label><select data-name="${r.name}" data-field="emotion">${this.emotionOptions(r.emotion)}</select></div>
              <div class="field"><label>音色</label><select data-name="${r.name}" data-field="voice">${this.voiceOptions(r.voice)}</select></div>
              <div class="field"><label>语速 ${r.rate}%</label><div class="slider-wrap"><input type="range" data-name="${r.name}" data-field="rate" min="-50" max="50" value="${r.rate}"><span class="slider-val">${r.rate}%</span></div></div>
              <div class="field"><label>音量 ${r.volume}%</label><div class="slider-wrap"><input type="range" data-name="${r.name}" data-field="volume" min="-50" max="50" value="${r.volume}"><span class="slider-val">${r.volume}%</span></div></div>
              <div class="field"><label>音调 ${r.pitch}Hz</label><div class="slider-wrap"><input type="range" data-name="${r.name}" data-field="pitch" min="-20" max="20" value="${r.pitch}"><span class="slider-val">${r.pitch}Hz</span></div></div>
            </div>
          `;
          box.appendChild(div);
        }
        box.querySelectorAll('select, input').forEach(el => {
          el.addEventListener('change', e => this.updateRole(e.target));
          el.addEventListener('input', e => this.updateRole(e.target));
        });
      }
      emotionOptions(selected) {
        const map = {story:'自然讲述',happy:'开心',sad:'悲伤',excited:'激动',angry:'愤怒',gentle:'温柔',fear:'恐惧',serious:'正式',poem:'诗歌'};
        return Object.entries(map).map(([k,v]) => `<option value="${k}" ${k===selected?'selected':''}>${v}</option>`).join('');
      }
      voiceOptions(selected) {
        const groups = {};
        for (const v of VOICES_ALL) {
          (groups[v.g] = groups[v.g] || []).push(`<option value="${v.v}" ${v.v===selected?'selected':''}>${v.label}</option>`);
        }
        return Object.keys(groups).map(g => `<optgroup label="${g}">${groups[g].join('')}</optgroup>`).join('');
      }
      updateRole(el) {
        const name = el.dataset.name;
        const field = el.dataset.field;
        const r = this.roles[name];
        r[field] = el.type === 'range' ? parseInt(el.value) : el.value;
        if (field === 'gender' || field === 'age') {
          if (!r.voice || r.voice === resolveVoice(field==='gender'?r.gender:r.gender, field==='age'?el.value:r.age, detectLang(this.getText()))) {
            r.voice = resolveVoice(r.gender, r.age, detectLang(this.getText()));
          }
        }
        if (field === 'pitch') el.nextElementSibling.textContent = el.value + 'Hz';
        else if (field === 'rate' || field === 'volume') el.nextElementSibling.textContent = el.value + '%';
        // 若改动性别/年龄且音色没变则自动匹配
        this.renderRoles();
      }
      async generateSegments() {
        const text = this.getText();
        if (!text) return this.log('请先输入文本。', 'error');
        const btn = document.getElementById('btnGenerate');
        this.setLoading(btn, true);
        try {
          if (this.mode === 'multi') {
            if (!Object.keys(this.roles).length) this.parseRoles();
          } else {
            this.segments = [{ speaker: '朗读', text }];
          }
          this.cache.clear();
          this.invalidateFull();
          await this.synthSegments();
          this.renderSegments();
          const failed = this.segments.filter(s => !s.blob).length;
          if (failed === 0) {
            this.log('全部片段生成完成，可点击试听。', 'success');
          } else {
            this.log(`完成：${this.segments.length - failed}/${this.segments.length} 个成功，${failed} 个失败（可点「应急试听」或用本地服务器打开后重试）。`, 'info');
          }
        } catch (e) {
          this.log('生成失败：' + e.message, 'error');
          console.error(e);
        } finally {
          this.setLoading(btn, false);
        }
      }
      async synthSegments() {
        const lang = detectLang(this.getText());
        for (let i = 0; i < this.segments.length; i++) {
          const seg = this.segments[i];
          let voice, pitch, rate, volume, emotion;
          if (this.mode === 'single') {
            const ge = document.getElementById('singleGender').value;
            const em = document.getElementById('singleEmotion').value;
            const age = ge === 'female' ? 'adult' : 'adult';
            const sv = document.getElementById('singleVoice').value;
            voice = sv || resolveVoice(ge, age, lang);
            emotion = em;
            pitch = parseInt(document.getElementById('singlePitch').value);
            rate = parseInt(document.getElementById('singleRate').value);
            volume = parseInt(document.getElementById('singleVolume').value);
          } else {
            const r = this.roles[seg.speaker] || this.roles[Object.keys(this.roles)[0]];
            voice = r.voice;
            emotion = detectEmotion(seg.text) !== 'neutral' ? detectEmotion(seg.text) : r.emotion;
            pitch = r.pitch;
            rate = r.rate;
            volume = r.volume;
          }
          const prosody = applyEmotion(emotion, pitch, rate, volume);
          const tts = new EdgeTTS();
          tts.voice = voice;
          tts.pitch = prosody.pitch;
          tts.rate = prosody.rate;
          tts.volume = prosody.volume;
          this.log(`正在合成片段 ${i+1}/${this.segments.length}：${seg.speaker}（已自动重试机制：最多3次）`);
          try {
            const blob = await tts.synth(seg.text);
            seg.blob = blob;
            seg.url = URL.createObjectURL(blob);
            seg.voice = voice;
            seg.prosody = prosody;
            seg.local = false;
          } catch (err) {
            seg.blob = null; seg.url = null; seg.voice = voice; seg.prosody = prosody; seg.local = false;
            this.log(`片段 ${i+1} 在线合成失败：${err.message}`, 'error');
            this.log(`提示：① 推荐用本地服务器打开（在文件目录运行 python -m http.server，然后访问 http://localhost:8000）。② 也可点击该片段的「应急试听」用浏览器内置语音（无情感）临时播放。`, 'info');
          }
        }
      }
      renderSegments() {
        const box = document.getElementById('segmentList');
        if (!this.segments.length) {
          box.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg><div>还没有生成片段<br>在左侧输入文本后点击「生成片段」</div></div>`;
          return;
        }
        box.innerHTML = '';
        this.segments.forEach((seg, idx) => {
          const div = document.createElement('div');
          div.className = 'segment';
          const failed = !seg.blob;
          const failBadge = failed ? '<span class="badge" style="background:#fee2e2;color:#991b1b">合成失败</span>' : '';
          div.innerHTML = `
            <div class="segment-header"><span class="segment-speaker">${idx+1}. ${seg.speaker}</span><span class="badge">${seg.voice || 'auto'}</span>${failBadge}</div>
            <div class="segment-text" id="seg-text-${idx}">${this.escapeHtml(seg.text)}</div>
            <div class="segment-actions">
              <button class="btn btn-secondary btn-play" data-idx="${idx}" ${failed?'disabled':''}>▶ 试听</button>
              <button class="btn btn-secondary btn-dl" data-idx="${idx}" ${failed?'disabled':''}>⬇ 下载</button>
              <button class="btn btn-danger btn-edit" data-idx="${idx}">✏️ 修改</button>
              <button class="btn btn-secondary btn-resynth hidden" data-idx="${idx}">🔄 重新合成</button>
              ${failed ? '<button class="btn btn-secondary btn-local-fallback" data-idx="'+idx+'" style="background:#fef3c7;color:#92400e">应急试听（无情感）</button>' : ''}
            </div>
            <textarea class="hidden" id="seg-edit-${idx}" style="margin-top:10px;min-height:60px">${seg.text}</textarea>
          `;
          box.appendChild(div);
        });
        box.querySelectorAll('.btn-play').forEach(btn => btn.addEventListener('click', e => this.playSegment(parseInt(e.target.dataset.idx))));
        box.querySelectorAll('.btn-dl').forEach(btn => btn.addEventListener('click', e => this.downloadSegment(parseInt(e.target.dataset.idx))));
        box.querySelectorAll('.btn-edit').forEach(btn => btn.addEventListener('click', e => this.editSegment(parseInt(e.target.dataset.idx))));
        box.querySelectorAll('.btn-resynth').forEach(btn => btn.addEventListener('click', e => this.resynthSegment(parseInt(e.target.dataset.idx))));
        box.querySelectorAll('.btn-local-fallback').forEach(btn => btn.addEventListener('click', e => {
          const i = parseInt(e.target.dataset.idx);
          const s = this.segments[i];
          if (LocalTTS.isAvailable()) {
            LocalTTS.speakNow(s.text, s.voice, s.prosody.pitch, s.prosody.rate, s.prosody.volume);
            this.log(`片段 ${i+1} 应急试听中（浏览器内置语音，无情感）...`);
          } else {
            this.log('浏览器不支持本地语音。', 'error');
          }
        }));
      }
      escapeHtml(t) {
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      playSegment(idx) {
        const seg = this.segments[idx];
        if (!seg.url) return this.log('该片段尚未生成或合成失败。', 'error');
        document.getElementById('mainPlayer').src = seg.url;
        document.getElementById('mainPlayer').play();
        this.log(`正在试听片段 ${idx+1}`);
      }
      downloadSegment(idx) {
        const seg = this.segments[idx];
        if (!seg.blob) return;
        const a = document.createElement('a');
        a.href = seg.url;
        a.download = `片段_${idx+1}_${seg.speaker}.mp3`;
        a.click();
      }
      editSegment(idx) {
        const textEl = document.getElementById(`seg-text-${idx}`);
        const editEl = document.getElementById(`seg-edit-${idx}`);
        const resynthBtn = document.querySelector(`.btn-resynth[data-idx="${idx}"]`);
        textEl.classList.add('hidden');
        editEl.classList.remove('hidden');
        resynthBtn.classList.remove('hidden');
      }
      async resynthSegment(idx) {
        const editEl = document.getElementById(`seg-edit-${idx}`);
        const newText = editEl.value.trim();
        if (!newText) return;
        this.segments[idx].text = newText;
        this.invalidateFull();
        document.getElementById(`seg-text-${idx}`).textContent = newText;
        editEl.classList.add('hidden');
        document.querySelector(`.btn-resynth[data-idx="${idx}"]`).classList.add('hidden');
        document.getElementById(`seg-text-${idx}`).classList.remove('hidden');
        this.log(`正在重新合成片段 ${idx+1}...`);
        await this.synthOneSegment(idx);
        this.renderSegments();
        this.log(`片段 ${idx+1} 已更新。`, 'success');
      }
      async synthOneSegment(idx) {
        const seg = this.segments[idx];
        const lang = detectLang(this.getText());
        let voice, pitch, rate, volume, emotion;
        if (this.mode === 'single') {
          const ge = document.getElementById('singleGender').value;
          const em = document.getElementById('singleEmotion').value;
          const sv = document.getElementById('singleVoice').value;
          voice = sv || resolveVoice(ge, 'adult', lang);
          emotion = em;
          pitch = parseInt(document.getElementById('singlePitch').value);
          rate = parseInt(document.getElementById('singleRate').value);
          volume = parseInt(document.getElementById('singleVolume').value);
        } else {
          const r = this.roles[seg.speaker] || this.roles[Object.keys(this.roles)[0]];
          voice = r.voice;
          emotion = detectEmotion(seg.text) !== 'neutral' ? detectEmotion(seg.text) : r.emotion;
          pitch = r.pitch; rate = r.rate; volume = r.volume;
        }
        const prosody = applyEmotion(emotion, pitch, rate, volume);
        const tts = new EdgeTTS();
        tts.voice = voice; tts.pitch = prosody.pitch; tts.rate = prosody.rate; tts.volume = prosody.volume;
        try {
          const blob = await tts.synth(seg.text);
          seg.blob = blob; seg.url = URL.createObjectURL(blob); seg.voice = voice; seg.prosody = prosody; seg.local = false;
        } catch (err) {
          seg.blob = null; seg.url = null; seg.voice = voice; seg.prosody = prosody; seg.local = false;
          this.log(`片段 ${idx+1} 在线合成失败：${err.message}`, 'error');
          throw err;
        }
      }
      async ensureAudioCtx() {
        if (!this.audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          try {
            // 尝试以 24kHz 建上下文：Edge TTS 原生音频就是 24kHz，可避免无谓重采样
            this.audioCtx = new AC({ sampleRate: 24000 });
            if (this.audioCtx.sampleRate !== 24000) {
              try { await this.audioCtx.close(); } catch (e) {}
              this.audioCtx = new AC();
            }
          } catch (e) {
            this.audioCtx = new AC();
          }
        }
        if (this.audioCtx.state === 'suspended') { try { await this.audioCtx.resume(); } catch (e) {} }
        return this.audioCtx;
      }
      invalidateFull() {
        this.fullBlob = null;
        if (this.fullUrl) { URL.revokeObjectURL(this.fullUrl); this.fullUrl = null; }
      }
      async buildFullAudio() {
        if (!this.segments.length) return null;
        // 检查是否有失败的片段
        const failed = this.segments.filter(s => !s.blob);
        if (failed.length) {
          throw new Error(`有 ${failed.length} 个片段合成失败，无法合并。请先确保所有片段在线合成成功（推荐用本地服务器打开本页面）。`);
        }
        const ctx = await this.ensureAudioCtx();
        const rate = ctx.sampleRate; // 编码采样率 = 解码采样率，杜绝变速
        const buffers = [];
        for (const seg of this.segments) {
          const arr = await seg.blob.arrayBuffer();
          const decoded = await ctx.decodeAudioData(arr);
          buffers.push(decoded);
        }
        const totalSamples = buffers.reduce((s, b) => s + b.length, 0);
        const out = ctx.createBuffer(1, totalSamples, rate);
        const ch = out.getChannelData(0);
        let off = 0;
        for (const b of buffers) {
          const data = b.getChannelData(0);
          ch.set(data, off);
          off += data.length;
        }
        const samples = out.getChannelData(0);
        const int16 = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) int16[i] = Math.max(-1, Math.min(1, samples[i])) * 0x7FFF;
        const mp3enc = new lamejs.Mp3Encoder(1, rate, 64);
        const mp3Data = [];
        const blockSize = 1152;
        for (let i = 0; i < int16.length; i += blockSize) {
          const chunk = int16.subarray(i, i + blockSize);
          const buf = mp3enc.encodeBuffer(chunk);
          if (buf.length) mp3Data.push(buf);
        }
        const end = mp3enc.flush();
        if (end.length) mp3Data.push(end);
        const blob = new Blob(mp3Data, { type: 'audio/mp3' });
        if (this.fullUrl) URL.revokeObjectURL(this.fullUrl);
        this.fullBlob = blob;
        this.fullUrl = URL.createObjectURL(blob);
        return blob;
      }
      async generateFull() {
        if (!this.segments.length) await this.generateSegments();
        if (!this.segments.length) return;
        const btn = document.getElementById('btnFull');
        this.setLoading(btn, true);
        try {
          this.log('正在合并片段并编码为 MP3...');
          await this.buildFullAudio();
          document.getElementById('mainPlayer').src = this.fullUrl;
          document.getElementById('fullAudioArea').classList.remove('hidden');
          this.log('完整音频已生成，可在线试听或下载。', 'success');
        } catch (e) {
          this.log('完整音频生成失败：' + e.message, 'error');
          console.error(e);
        } finally {
          this.setLoading(btn, false);
        }
      }
      async playFull() {
        if (!this.fullUrl) {
          this.log('正在生成完整音频...');
          await this.buildFullAudio();
          document.getElementById('fullAudioArea').classList.remove('hidden');
        }
        if (!this.fullUrl) return;
        const player = document.getElementById('mainPlayer');
        player.src = this.fullUrl;
        player.play();
        this.log('正在试听完整音频...');
      }
      async downloadFull() {
        if (!this.segments.length) return;
        const btn = document.getElementById('btnDownloadFull');
        btn.disabled = true;
        btn.textContent = '编码中...';
        try {
          if (!this.fullBlob) {
            this.log('正在合并片段并编码为 MP3...');
            await this.buildFullAudio();
          }
          const url = this.fullUrl || URL.createObjectURL(this.fullBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Lucky完整朗读.mp3';
          a.click();
          this.log('完整 MP3 已下载。', 'success');
        } catch (e) {
          this.log('合并下载失败：' + e.message, 'error');
          console.error(e);
        } finally {
          btn.disabled = false;
          btn.textContent = '⬇ 下载 MP3';
        }
      }
    }

    const app = new App();
    app.log('提示：本程序使用微软 Edge 神经语音（有情感、高质量）。若合成失败，已内置最多3次自动重试。推荐通过本地服务器打开：在文件所在目录运行 python -m http.server，然后浏览器访问 http://localhost:8000/本文件名.html，可避免 file:// 协议的跨域限制。');
  </script>
</body>
